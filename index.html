<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestionale Impianti</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1F23">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#F1EFEA;--pn:#FFFFFF;--ln:#DEDAD2;--ln2:#E7E4DC;--ink:#1B1F23;--mu:#5A5F66;--lk:#C2410C;--side:#1B1F23;--sidetx:#C9CCD1;--hd:#EEEBE4;--inp:#FFFFFF;--bar:#0F766E;
--green-bg:#DCF0E1;--green-tx:#14532D;--amber-bg:#FBE8C8;--amber-tx:#7A4A05;--red-bg:#F8DADA;--red-tx:#7F1D1D;--blue-bg:#D5E1F5;--blue-tx:#1E3A6E;--grey-bg:#E8E6E0;--grey-tx:#3F444A;--purple-bg:#E4DAF2;--purple-tx:#43276F;--teal-bg:#CFE8E4;--teal-tx:#0B4F49;--gray-bg:#DDE3EA;--gray-tx:#2F3B48}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171A;--pn:#1D2125;--ln:#343A40;--ln2:#2B3035;--ink:#E8E6E1;--mu:#A3A8AE;--lk:#F0895A;--side:#0E1113;--sidetx:#B9BDC2;--hd:#252A2F;--inp:#14171A;--bar:#2AA198;
--green-bg:#1E3A28;--green-tx:#A9E0BB;--amber-bg:#47340F;--amber-tx:#F3CE8E;--red-bg:#4A2020;--red-tx:#F5B5B5;--blue-bg:#22354F;--blue-tx:#B5CDF0;--grey-bg:#2C3136;--grey-tx:#C4C8CD;--purple-bg:#372B4C;--purple-tx:#D3C4EE;--teal-bg:#17403B;--teal-tx:#A6DED6;--gray-bg:#2A3440;--gray-tx:#C3CDD8}}
:root[data-theme="dark"]{--bg:#14171A;--pn:#1D2125;--ln:#343A40;--ln2:#2B3035;--ink:#E8E6E1;--mu:#A3A8AE;--lk:#F0895A;--side:#0E1113;--sidetx:#B9BDC2;--hd:#252A2F;--inp:#14171A;--bar:#2AA198;
--green-bg:#1E3A28;--green-tx:#A9E0BB;--amber-bg:#47340F;--amber-tx:#F3CE8E;--red-bg:#4A2020;--red-tx:#F5B5B5;--blue-bg:#22354F;--blue-tx:#B5CDF0;--grey-bg:#2C3136;--grey-tx:#C4C8CD;--purple-bg:#372B4C;--purple-tx:#D3C4EE;--teal-bg:#17403B;--teal-tx:#A6DED6;--gray-bg:#2A3440;--gray-tx:#C3CDD8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:224px;flex-shrink:0;background:var(--side);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:700 26px/1 'Barlow Condensed',sans-serif;letter-spacing:.05em;color:#fff;padding:0 10px 18px}
.nv{display:flex;align-items:center;min-height:44px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--sidetx);font:500 15px 'IBM Plex Sans',sans-serif;text-align:left;cursor:pointer;width:100%}
.nv:hover,.nv.on{background:#2C3238;color:#fff}
.nv.on{font-weight:600}
.sidefoot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:#8C929A;display:flex;flex-direction:column;gap:6px}
.sidefoot button{background:none;border:0;padding:6px 0;color:var(--sidetx);text-align:left;cursor:pointer;font-size:13px;text-decoration:underline}
.main{flex:1;min-width:0;padding:28px 36px 64px}
h1{font:700 40px/1 'Barlow Condensed',sans-serif;margin:0}
h2{font:600 19px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;margin:0}
h3{font:600 15px/1.3 'IBM Plex Sans',sans-serif;margin:0}
.sub{color:var(--mu);margin:6px 0 0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.sp{justify-content:space-between}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.kpi .v{font:700 36px/1 'Barlow Condensed',sans-serif}
.kpi .n{font-size:13px;color:var(--mu)}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--mu)}
.btn.p{background:#C2410C;border-color:#C2410C;color:#fff}
.btn.p:hover{background:#A8360A}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.d{color:var(--red-tx)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--lk);font-weight:600;cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.mono{font:500 13px 'IBM Plex Mono',monospace;white-space:nowrap}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green-tx)}
.badge.amber{background:var(--amber-bg);color:var(--amber-tx)}
.badge.red{background:var(--red-bg);color:var(--red-tx)}
.badge.blue{background:var(--blue-bg);color:var(--blue-tx)}
.badge.grey{background:var(--grey-bg);color:var(--grey-tx)}
.badge.purple{background:var(--purple-bg);color:var(--purple-tx)}
.badge.teal{background:var(--teal-bg);color:var(--teal-tx)}
.badge.gray{background:var(--gray-bg);color:var(--gray-tx)}
.badge.dark{background:#1B1F23;color:#fff}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:8px 10px;background:var(--hd);white-space:nowrap}
.tbl td{padding:9px 10px;border-top:1px solid var(--ln2);vertical-align:middle}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--hd)}
.tbl td.r,.tbl th.r{text-align:right}
.muted{color:var(--mu)}
.small{font-size:12px}
.empty{padding:18px;color:var(--mu);text-align:center}
.bar{height:8px;border-radius:4px;background:var(--ln2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--bar)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--ln);margin-bottom:16px}
.tab{min-height:44px;padding:0 14px;border:0;background:none;color:var(--mu);font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:#C2410C}
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fbar input,.fbar select{min-height:40px}
input,select,textarea{border:1px solid var(--ln);border-radius:8px;background:var(--inp);padding:8px 10px;width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:#C2410C}
input[type=file]{padding:6px}
.fbar input{width:260px}.fbar select{width:auto}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.kv .k{font-size:12px;font-weight:600;color:var(--mu)}
.iter{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.iter .st{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.25}
.iter .st i{display:block;height:6px;border-radius:3px}
.vc{display:flex;align-items:center;gap:10px;min-height:36px;border-top:1px solid var(--ln2)}
.vc label{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1}
.vc.done span{text-decoration:line-through;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.ov.top{z-index:60;align-items:center}
.mod{background:var(--pn);border:1px solid var(--ln);border-radius:12px;width:100%;max-width:560px;padding:22px;display:flex;flex-direction:column;gap:14px}
.mod.wide{max-width:820px}.mod.sm{max-width:420px}
.mod .mt{margin-bottom:2px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;grid-column:1/-1}
.fld.half{grid-column:auto}
.fld>label{font-size:12px;font-weight:600;color:var(--mu)}
.fld.chk label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.multi{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--inp);max-height:180px;overflow:auto}
.multi .mo{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);font-weight:500}
.hint{font-size:12px;color:var(--mu)}
.err{color:var(--red-tx);font-size:13px;min-height:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B1F23;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw}
.toast.show{opacity:1}.toast.err{background:#7F1D1D}
.alert{border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.alert.amber{background:var(--amber-bg);color:var(--amber-tx)}
.alert.red{background:var(--red-bg);color:var(--red-tx)}
.alert.green{background:var(--green-bg);color:var(--green-tx)}
.alert ul{margin:4px 0 0;padding-left:18px}
.pl{display:grid;grid-template-columns:170px repeat(8,minmax(96px,1fr));min-width:940px}
.pl>div{border-top:1px solid var(--ln2);border-left:1px solid var(--ln2);min-height:64px;padding:4px}
.pl>.h{background:var(--hd);font-size:12px;font-weight:600;min-height:48px;display:flex;flex-direction:column;justify-content:center;padding:6px 8px}
.pl>.s{display:flex;flex-direction:column;justify-content:center;border-left:0;padding:6px 10px;font-weight:600}
.pl>.h.now{box-shadow:inset 0 -3px 0 #C2410C}
.cellb{width:100%;height:100%;min-height:56px;border-radius:6px;border:1px dashed var(--ln);background:none;color:var(--mu);font-size:12px;cursor:pointer;text-align:left;padding:6px 8px}
.cellb.f{border-style:solid;font-weight:600;color:inherit}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-right:1px solid var(--ln2);border-bottom:1px solid var(--ln2)}
.cal .wd{padding:6px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);border:0}
.cal .cd{min-height:96px;border-top:1px solid var(--ln2);border-left:1px solid var(--ln2);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .cd.out{background:var(--hd)}
.cal .cd .n{font-size:12px;font-weight:600;padding:0 2px}
.cal .cd .n.today{background:#C2410C;color:#fff;border-radius:12px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;padding:0 4px}
.chip{display:block;width:100%;border:0;text-align:left;font-size:11px;font-weight:600;line-height:1.25;padding:3px 6px;border-radius:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.green{background:var(--green-bg);color:var(--green-tx)}.chip.amber{background:var(--amber-bg);color:var(--amber-tx)}.chip.blue{background:var(--blue-bg);color:var(--blue-tx)}.chip.purple{background:var(--purple-bg);color:var(--purple-tx)}.chip.teal{background:var(--teal-bg);color:var(--teal-tx)}.chip.gray{background:var(--gray-bg);color:var(--gray-tx)}
.tree{display:flex;flex-direction:column;gap:2px}
.tree button{display:flex;justify-content:space-between;align-items:center;min-height:38px;border:0;background:none;border-radius:6px;padding:0 10px;cursor:pointer;text-align:left;width:100%}
.tree button:hover,.tree button.on{background:var(--hd)}
.tree button.c{padding-left:26px;font-weight:400}
.tree button.p{font-weight:600}
.blk{display:flex;gap:12px;align-items:flex-start;padding-top:10px;border-top:1px solid var(--ln2)}
.dot{width:26px;height:26px;flex-shrink:0;border-radius:13px;background:#1B1F23;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.center{max-width:560px;margin:80px auto;text-align:center}
@media (max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}.brand{padding:0 10px;width:100%}.nv{width:auto;min-height:40px;font-size:14px}.sidefoot{display:none}.main{padding:18px 14px 48px}.g2,.g3,.g4{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.fld.half{grid-column:1/-1}.iter{grid-template-columns:repeat(3,minmax(0,1fr))}.kv{grid-template-columns:1fr}h1{font-size:32px}}

.tbl td.day{white-space:nowrap;width:1%}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="dlg"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- utilità ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = (s) => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = parseD(s); d.setMonth(d.getMonth() + n); return iso(d); };
const diff = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const monday = (s) => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const fmtD = (s) => (s ? String(s).split('-').reverse().join('/') : '');
const MESI3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
const fmtShort = (s) => { if (!s) return ''; const d = parseD(s); return d.getDate() + ' ' + MESI3[d.getMonth()]; };
const eur = (n) => '€\u00a0' + Math.round(Number(n) || 0).toLocaleString('it-IT');
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const isoWeek = (s) => { const d = parseD(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); };
const sum = (a, f) => a.reduce((t, x) => t + (Number(f ? f(x) : x) || 0), 0);
const byStr = (f) => (a, b) => String(f(a) || '').localeCompare(String(f(b) || ''), 'it');

/* ---------- stato ---------- */
const COLS = ['clienti', 'commesse', 'dipendenti', 'squadre', 'assegnazioni', 'tipiLavoro', 'categorie', 'docAzienda', 'assicurazioni', 'mezzi', 'documenti', 'verbali', 'scadenze', 'riservato', 'accessi', 'impostazioni', 'commesseElenco', 'registri'];
const S = { route: 'dashboard', id: null, tab: null, q: '', fstato: '', week: null, calY: null, calM: null, ftipo: '', dcat: '', ptab: 'dipendenti', atab: 'documenti', data: {}, loaded: {}, admin: false, me: '', uid: null, late: false, offline: false, mese: null, otab: 'riepilogo', opers: null, myOre: { mese: null, righe: [], loaded: false }, oreAll: {}, oreLoading: false, prof: {} };
const D = (c) => Object.values(S.data[c] || {});
const G = (c, id) => (S.data[c] || {})[id];
let db = null, assets = null, user = null, dl = null;

const errMsg = (e) => (e && e.vmsg ? e.vmsg : e && e.code === 'quota_exceeded' ? 'Limite di documenti raggiunto.' : e && e.code === 'invalid_argument' ? 'Non hai i permessi per modificare questi dati.' : 'Salvataggio non riuscito, riprova.');
const chain = {};
function serial(path, fn) { const p = (chain[path] || Promise.resolve()).catch(() => {}).then(fn); chain[path] = p; return p; }
async function put(col, id, obj) { const o = clone(obj); delete o.id; try { await serial(col + '/' + id, () => db.doc(col + '/' + id).set(o)); } catch (e) { toast(errMsg(e), 'err'); throw e; } }
async function patch(col, id, part) { try { await serial(col + '/' + id, () => db.doc(col + '/' + id).update(clone(part))); } catch (e) { toast(errMsg(e), 'err'); throw e; } }
async function remove(col, id) { try { await serial(col + '/' + id, () => db.doc(col + '/' + id).delete()); } catch (e) { toast(errMsg(e), 'err'); throw e; } }
const newId = (col) => db.collection(col).doc().id;
async function uploadFile(file) { if (!assets) throw new Error('assets'); const r = await assets.upload(file); return { id: r.id, name: file.name, url: r.url || '' }; }

/* ---------- rendering ---------- */
let rq = 0;
function queueRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
function render() {
  const app = $('#app'); if (!app) return;
  const ae = document.activeElement;
  const fid = ae && ae.id && app.contains(ae) ? ae.id : null;
  const sel = ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;
  app.innerHTML = shell();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
  window.scrollTo(0, y);
}
const routeHooks = {};
function go(route, id, tab) { S.route = route; S.id = id || null; S.tab = tab || null; S.q = ''; S.fstato = ''; S.opers = null; closeModal(); if (routeHooks[route]) routeHooks[route](); queueRender(); window.scrollTo(0, 0); }

/* ---------- finestre e form ---------- */
let FORM = null;
function openModal(html, wide) { $('#modal').innerHTML = '<div class="ov"><div class="mod' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div></div>'; const f = $('#modal input:not([type=hidden]):not([type=checkbox]),#modal select,#modal textarea'); if (f) f.focus(); }
function closeModal() { const m = $('#modal'); if (m) m.innerHTML = ''; FORM = null; }
function toast(msg, kind) { const t = $('#toast'); if (!t) return; t.textContent = msg; t.className = 'toast show ' + (kind || ''); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = 'toast'; }, 3500); }
function confirmBox(msg, label) {
  return new Promise((res) => {
    const el = $('#dlg');
    el.innerHTML = '<div class="ov top"><div class="mod sm" role="alertdialog"><p style="margin:0">' + esc(msg) + '</p><div class="row end"><button class="btn" id="dlgNo">Annulla</button><button class="btn p" id="dlgYes">' + esc(label || 'Conferma') + '</button></div></div></div>';
    $('#dlgNo').onclick = () => { el.innerHTML = ''; res(false); };
    $('#dlgYes').onclick = () => { el.innerHTML = ''; res(true); };
    $('#dlgYes').focus();
  });
}
function fld(f, v) {
  const id = 'f_' + f.k, t = f.t || 'text', cl = 'fld' + (f.half ? ' half' : '');
  const lb = '<label for="' + id + '">' + esc(f.l) + (f.req ? ' *' : '') + '</label>';
  const ht = f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '';

/* controlli prima di assegnare una squadra a una commessa in una settimana */
function verifica(c, sq, week) {
  const bl = [], av = [], end = addDays(week, 6);
  if (!stepOk(stepOf(c, 'CONFERMA_ORDINE'))) bl.push('La conferma d\u2019ordine non è completata.');
  if (!stepOk(stepOf(c, 'POS'))) bl.push('Il POS non è ancora approvato.');
  if (!docAzOk('DURC', week)) bl.push('Il DURC aziendale manca o è scaduto.');
  const tipi = (c.tipiLavoro || []).map((id) => G('tipiLavoro', id)).filter(Boolean);
  const abReq = new Set(), docReq = new Set();
  tipi.forEach((t) => { (t.abilitazioniRichieste || []).forEach((x) => abReq.add(x)); (t.docImpresaRichiesti || []).forEach((x) => docReq.add(x)); });
  docReq.forEach((k) => { if (!docAzOk(k, week)) bl.push('Manca un documento aziendale valido: ' + lab(TIPI_DOC_AZ, k) + '.'); });
  const membri = (sq.membri || []).map((id) => G('dipendenti', id)).filter(Boolean);
  if (!membri.length) av.push('La squadra non ha dipendenti assegnati.');
  abReq.forEach((k) => {
    const manca = [], scade = [];
    membri.forEach((d) => {
      const a = (d.abilitazioni || []).filter((x) => x.tipo === k);
      if (!a.some((x) => !x.dataScadenza || x.dataScadenza >= week)) manca.push(d.cognome);
      else if (!a.some((x) => !x.dataScadenza || x.dataScadenza >= end)) scade.push(d.cognome);
    });
    if (manca.length) bl.push(abLabel(k) + ' mancante o scaduta: ' + manca.join(', ') + '.');
    if (scade.length) av.push(abLabel(k) + ' scade durante la settimana: ' + scade.join(', ') + '.');
  });
  return { bl, av };
}

function eventi() {

  D('dipendenti').forEach((d) => (d.abilitazioni || []).forEach((a) => push(a.dataScadenza, 'FORMAZIONE', abLabel(a.tipo), nomeD(d), { r: 'dipendente', id: d.id })));

  D('assicurazioni').forEach((x) => push(x.dataScadenza, 'ASSICURAZIONE', lab(TIPI_ASS, x.tipo), x.compagnia || '', { r: 'azienda', tab: 'assicurazioni' }));
  D('mezzi').forEach((m) => {
    push(m.revisioneScadenza, 'MEZZO', 'Revisione ' + m.descrizione, m.targa || '', { r: 'mezzo', id: m.id });
    push(m.bolloScadenza, 'MEZZO', 'Bollo ' + m.descrizione, m.targa || '', { r: 'mezzo', id: m.id });
    const ult = {};
    (m.controlli || []).forEach((c) => { if (!ult[c.tipo] || c.data > ult[c.tipo].data) ult[c.tipo] = c; });
    Object.values(ult).forEach((c) => push(c.prossimaScadenza, 'MEZZO', lab(TIPI_CONTROLLO, c.tipo) + ' ' + m.descrizione, m.targa || '', { r: 'mezzo', id: m.id }));
  });
  D('commesse').forEach((c) => {
    if (!ATTIVE.includes(c.stato)) return;
    (c.sicurezza || []).forEach((s) => push(s.dataScadenza, 'SICUREZZA', lab(TIPI_SIC, s.tipo) + ' ' + c.codice, c.titolo, { r: 'commessa', id: c.id, tab: 'sicurezza' }));
    (c.pagamenti || []).forEach((p) => { const res = (Number(p.importo) || 0) - incassatoP(p); if (res > 0.5) push(p.dataScadenza, 'INCASSO', 'Incasso ' + (p.descrizione || lab(TIPI_PAG, p.tipo)) + ' · ' + eur(res), c.codice + ' · ' + clienteNome(c.clienteId), { r: 'commessa', id: c.id, tab: 'economia' }); });
  });
  D('verbali').concat(D('riservato').filter((x) => x.kind === 'verbale')).forEach((v) => (v.azioni || []).forEach((a) => { if (a.stato !== 'CHIUSA') push(a.scadenza, 'ALTRO', a.descrizione, 'Azione da verbale · ' + (a.responsabile || ''), { r: 'documentale' }); }));

  return ev.sort((a, b) => a.data.localeCompare(b.data));
}

function vScadenzario() {
  const t = today(), d0 = parseD(t);
  if (S.calY == null) { S.calY = d0.getFullYear(); S.calM = d0.getMonth(); }
  const ev = eventi().filter((e) => !S.ftipo || e.tipo === S.ftipo);
  const first = new Date(S.calY, S.calM, 1), start = new Date(S.calY, S.calM, 1 - ((first.getDay() + 6) % 7));
  let cal = '<div class="cal">' + ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].map((x) => '<div class="wd">' + x + '</div>').join('');
  for (let i = 0; i < 42; i++) {

const giorniDelMese = (m) => { const p = m.split('-').map(Number), n = new Date(p[0], p[1], 0).getDate(); return Array.from({ length: n }, (_, i) => m + '-' + String(i + 1).padStart(2, '0')); };
const hm = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '').trim()); if (!m) return null; const h = +m[1], mi = +m[2]; return h > 23 || mi > 59 ? null : h * 60 + mi; };
const fmtMin = (m) => { m = Math.round(m || 0); const s = m < 0 ? '-' : ''; m = Math.abs(m); return s + Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
const decOre = (m) => String(Math.round((m || 0) / 60 * 100) / 100).replace('.', ',');
const tipoR = (r) => r.t || 'L';
const minRiga = (r) => { if (tipoR(r) === 'L') { const i = hm(r.i), u = hm(r.u); return i == null || u == null || u <= i ? 0 : Math.max(0, u - i - (Number(r.p) || 0)); } return Math.round((Number(r.o) || 0) * 60); };
const minTot = (righe) => sum(righe, minRiga);
const sogliaMin = () => Math.round((num((G('impostazioni', 'ore') || {}).soglia) || 8) * 60);
function oreTot(righe) {
  const t = { L: 0, F: 0, P: 0, M: 0, A: 0 }, per = {};
  righe.forEach((r) => { const k = tipoR(r); t[k] = (t[k] || 0) + minRiga(r); if (k === 'L') per[r.d] = (per[r.d] || 0) + minRiga(r); });
  const so = sogliaMin();
  return { t, giorni: Object.keys(per).filter((d) => per[d] > 0).length, oltre: Object.values(per).reduce((a, m) => a + Math.max(0, m - so), 0) };
}
function eoloTot(righe) { const t = { M: 0, A: 0, G: 0, K: 0 }; righe.forEach((r) => { if (r.e && t[r.e] != null) t[r.e] += Math.max(1, Number(r.eq) || 1); }); t.tot = t.M + t.A + t.G + t.K; return t; }

function validaRiga(r, altre) {
  if (!r.d) return 'Indica la data.';
  if (tipoR(r) === 'L') {
    if (r.d > today()) return 'Non puoi registrare ore di lavoro in una data futura.';
    const i = hm(r.i), u = hm(r.u), p = Number(r.p) || 0;
    if (i == null) return 'Indica l\u2019ora di ingresso (formato 07:30).';
    if (u == null) return 'Indica l\u2019ora di uscita (formato 16:30).';
    if (u <= i) return 'L\u2019uscita deve essere dopo l\u2019ingresso.';
    if (p < 0 || p >= u - i) return 'La pausa deve essere più breve del turno.';
    if (u - i > 16 * 60) return 'Un turno non può superare le 16 ore.';
    if (String(r.a || '').trim().length < 3) return 'Descrivi le attività svolte.';
    if (altre.some((x) => x.id !== r.id && x.d === r.d && tipoR(x) === 'L' && hm(x.i) != null && hm(x.u) != null && i < hm(x.u) && hm(x.i) < u)) return 'Questo orario si sovrappone a un altro inserimento dello stesso giorno.';

function snapFromDocs(docsMap) { return { docs: Object.keys(docsMap || {}).map((id) => ({ id: id, data: () => docsMap[id] })) }; }
/* notifica subito i listener di una collezione usando lo stato attuale di pollCache,
   usata sia dal polling periodico sia (per sentirsi reattivi) subito dopo ogni scrittura riuscita */
function dispatchCollection(col) {
  const reg = collListeners[col]; if (!reg) return;
  const key = JSON.stringify((pollCache && pollCache[col]) || {});
  if (reg.last !== key) { reg.last = key; reg.cbs.forEach((cb) => cb(snapFromDocs(pollCache[col]))); }
}
function applyLocalWrite(col, id, doc) {
  if (!pollCache) pollCache = {};
  if (!pollCache[col]) pollCache[col] = {};
  if (doc == null) delete pollCache[col][id]; else pollCache[col][id] = doc;
  dispatchCollection(col);
}
async function pollOnce() {
  try {
    const r = await api('listAll');
    pollCache = r.cols || {};
    Object.keys(collListeners).forEach(dispatchCollection);
  } catch (e) {
    Object.keys(collListeners).forEach((col) => {
      const reg = collListeners[col];
      if (reg.last == null) { reg.last = '{}'; reg.errcbs.forEach((ecb) => ecb(e)); }
    });
  }
}
/* Ciclo che si riavvia da solo SOLO dopo che la chiamata precedente è finita, invece di un
   setInterval a orario fisso: se il backend è lento e una listAll impiega più di POLL_MS,
   un timer fisso avrebbe accumulato richieste una sopra l'altra, intasando il backend. */
let pollRunning = false;
function ensurePoll() {
  if (pollTimer) return;
  pollTimer = true;
  (async function loop() {
    while (pollTimer) {
      pollRunning = true;
      await pollOnce();
      pollRunning = false;
      if (!pollTimer) break;
      await new Promise((res) => setTimeout(res, POLL_MS));
    }
  })();
}
function stopPoll() { pollTimer = null; pollRunning = false; Object.keys(collListeners).forEach((k) => delete collListeners[k]); pollCache = null; }

db = {
  collection: (col) => ({
    doc: () => ({ id: uid() }),
    onSnapshot: (cb, errCb) => {
      if (!collListeners[col]) collListeners[col] = { cbs: [], errcbs: [], last: null };
      collListeners[col].cbs.push(cb);
      if (errCb) collListeners[col].errcbs.push(errCb);
      ensurePoll();
      if (pollCache && pollCache[col]) cb(snapFromDocs(pollCache[col]));
      return () => { if (collListeners[col]) collListeners[col].cbs = collListeners[col].cbs.filter((x) => x !== cb); };
    }
  }),
  doc: (path) => {
    const parts = path.split('/');
    const col = parts[0], id = parts.length >= 4 ? parts[1] + '::' + parts[3] : parts[1];
    return {
      get: async () => { const r = await api('get', { col: col, id: id }); return { exists: !!r.found, data: () => r.doc }; },
      set: async (obj) => { await api('set', { col: col, id: id, data: obj }); applyLocalWrite(col, id, obj); },
      update: async (part) => { const r = await api('update', { col: col, id: id, data: part }); applyLocalWrite(col, id, r.doc); },
      delete: async () => { await api('delete', { col: col, id: id }); applyLocalWrite(col, id, null); },
      onSnapshot: (cb, errCb) => {
        let stopped = false, last = null;
        (async function loop() {
          while (!stopped) {
            try {
              const r = await api('get', { col: col, id: id });
              const key = JSON.stringify(r.doc || null);
              if (key !== last) { last = key; cb({ exists: !!r.found, data: () => r.doc }); }
            } catch (e) { if (errCb) errCb(e); }
            await new Promise((res) => setTimeout(res, POLL_MS));
          }
        })();
        return () => { stopped = true; };
      }
    };
  }
};

assets = {
  upload: (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = String(reader.result).split(',')[1] || '';
        const r = await api('upload', { filename: file.name, mimeType: file.type || 'application/octet-stream', base64: base64 });
        resolve({ id: r.id, name: file.name, url: r.url || '' });
      } catch (e) { reject(e); }
    };
    reader.onerror = () => reject(new Error('Lettura del file non riuscita.'));
    reader.readAsDataURL(file);
  })
};

user = {
  byEmail: true,
  me: async () => { const w = await whoami(); return { name: w.name }; },
  id: async () => { const w = await whoami(); return w.email; },
  canEdit: async () => { const w = await whoami(); return w.role === 'admin'; }
};

dl = {
  save: ({ filename, data }) => {
    const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return Promise.resolve();
  }
};

window.__logout = () => {
  ID_TOKEN = null; WHOAMI_CACHE = null; stopPoll();
  try { if (window.google && window.google.accounts && window.google.accounts.id) window.google.accounts.id.disableAutoSelect(); } catch (e) { /* ignora */ }
  S.route = 'dashboard'; S.id = null; S.tab = null; S.data = {}; S.loaded = {}; S.admin = false; S.me = ''; S.uid = null; S.unauthorized = false; S.pendingEmail = ''; S.offline = false; S.late = false;
  showLogin();
};
A.signout = () => window.__logout();

function showLogin(err) {
  const el = $('#app'); if (!el) return;
  el.innerHTML = '<div class="center card"><h1 style="font-size:28px">Gestionale Impianti</h1><p class="muted">Accedi con il tuo account Google per continuare.</p><div id="gsiBtn" style="display:flex;justify-content:center;margin-top:10px"></div>' + (err ? '<p class="err" style="margin-top:10px">' + esc(err) + '</p>' : '') + '</div>';
  if (!CONFIG.CLIENT_ID || !CONFIG.SCRIPT_URL) { $('.center.card').insertAdjacentHTML('beforeend', '<p class="alert amber" style="margin-top:10px">Configura CLIENT_ID e SCRIPT_URL in fondo a index.html: vedi il README.</p>'); return; }
  loadGis().then(() => {
    google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: onGoogleCredential, auto_select: true, cancel_on_tap_outside: false });
    google.accounts.id.renderButton($('#gsiBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'it' });
    /* se hai già effettuato l'accesso in precedenza su questo sito, prova ad entrare da solo senza bisogno di cliccare */
    google.accounts.id.prompt();
  }).catch((e) => { showLogin(e.message); });
}
async function onGoogleCredential(resp) {
  ID_TOKEN = resp.credential;
  const el = $('#app'); if (el) el.innerHTML = '<div class="empty">Accesso in corso…</div>';
  try { await whoami(true); boot(); } catch (e) { ID_TOKEN = null; showLogin(e.message || 'Accesso non riuscito.'); }
}

/* ---------- avvio ---------- */
function subscribe(col) {
  db.collection(col).onSnapshot((snap) => {
    const m = {};
    snap.docs.forEach((d) => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); });
    S.data[col] = m; S.loaded[col] = true; if (col === 'impostazioni') applyConfig(); queueRender();
    if (['commesse', 'commesseElenco', 'clienti', 'assegnazioni', 'squadre', 'accessi'].includes(col)) maybeSync();
    if (col === 'accessi') { resolveProf(); if (S.route === 'ore' && !S.oreLoading) loadAllOre(S.mese || meseOggi(), true); }
  }, (err) => { console.warn('db', col, err); S.data[col] = S.data[col] || {}; S.loaded[col] = true; queueRender(); });
}
function subscribeUser() {
  if (S.uid) {
    db.doc('accessi/' + S.uid).onSnapshot((snap) => { S.data.accessi = snap.exists ? { [S.uid]: Object.assign({}, snap.data(), { id: S.uid }) } : {}; S.loaded.accessi = true; queueRender(); }, () => { S.data.accessi = {}; S.loaded.accessi = true; queueRender(); });
  } else { S.data.accessi = {}; S.loaded.accessi = true; }
  subscribe('commesseElenco');
}
routeHooks.ore = () => { if (!S.mese) S.mese = meseOggi(); loadAllOre(S.mese); };
routeHooks.mieore = () => { if (!S.mese) S.mese = meseOggi(); if (S.myOre.mese !== S.mese) watchMio(S.mese); ensureView(); };
async function boot() {
  render();
  if (!ID_TOKEN) { showLogin(); return; }
  let w;
  try { w = await whoami(); } catch (e) { ID_TOKEN = null; showLogin(e.message || 'Accesso non riuscito.'); return; }
  if (w.unauthorized) { S.unauthorized = true; S.pendingEmail = w.email; render(); return; }
  S.admin = w.role === 'admin'; S.me = w.name || ''; S.uid = w.email;
  S.mese = meseOggi();
  setTimeout(() => { S.late = true; queueRender(); }, 6000);
  if (S.admin) COLS.forEach(subscribe); else { S.route = 'mieore'; subscribeUser(); }
  if (S.uid) watchMio(S.mese);
  setInterval(() => { if (S.admin && !FORM && !document.hidden) { if (S.route === 'ore') loadAllOre(S.mese || meseOggi(), true); else if (S.route === 'mieore') ensureView(); } }, 60000);
  queueRender();
}
if (typeof window !== 'undefined' && !window.__TEST__) showLogin();
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
}
</script>
